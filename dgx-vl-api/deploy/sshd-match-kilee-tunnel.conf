# ─────────────────────────────────────────────────────────────────────────────
# kilee-vl 多租户隧道账号的 sshd 策略（追加到 /etc/ssh/sshd_config 末尾）
# Match 块必须位于所有全局指令之后。
#
# 端口级限制在 authorized_keys（每密钥 permitlisten），此处做全局兜底：
#   - AllowTcpForwarding remote : 只允许反向转发(-R)，堵死 -L 跳板
#   - PermitOpen none           : 即使有 -L 也无目标可达
#   - GatewayPorts no           : 只绑回环
#   - PermitTTY no / ForceCommand nologin : 不给 shell
# ─────────────────────────────────────────────────────────────────────────────
Match User kilee-tunnel
    AllowTcpForwarding remote
    PermitOpen none
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PasswordAuthentication no
    ForceCommand /usr/sbin/nologin
